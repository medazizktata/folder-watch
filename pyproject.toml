[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "folder-watch"
description = "Watch a folder until files finish writing, then run a pluggable action."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["watchdog>=4.0.0"]
classifiers = [
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]

# Installing these is the point of packaging this: they land on PATH pointing
# at the interpreter that owns the dependencies, which is what the .venv +
# PYTHONPATH + bash-wrapper arrangement was approximating by hand.
[project.scripts]
folder-watch = "folder_watch.cli:main"
watch-copy = "folder_watch.shortcuts:copy_main"
watch-unzip = "folder_watch.shortcuts:unzip_main"
watch-convx = "folder_watch.shortcuts:convx_main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "coverage>=7.6"]

[tool.ruff]
line-length = 90
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import sorting
  "UP",        # pyupgrade
  "B",         # bugbear
  "C4",        # comprehensions
  "SIM",       # simplify
  "RUF",
  "EXE",       # shebang/executable-bit agreement
]
ignore = [
  # try/except/pass around best-effort cleanup is used consistently here and
  # reads fine; contextlib.suppress would churn 8 sites for no behaviour change.
  "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# Both suites must put the repo on sys.path and import tests/_isolate (which
# redirects state off the real ~/.local/state) before folder_watch is imported.
"tests/*" = ["E402"]

[tool.hatch.version]
path = "folder_watch/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["folder_watch"]

[tool.hatch.build.targets.sdist]
include = ["folder_watch", "tests", "bin", "README.md"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Not strict: the value is catching a variable rebound to a different type,
# which is what it found — `member` used as both Path and str, plus two
# shadowed names. Strict mode would bury that under annotation chores.
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["folder_watch"]
omit = ["*/__main__.py"]

[tool.coverage.report]
# A floor, not a target — so coverage cannot quietly erode. The event loop is
# the part that matters and it now sits at 96%; what is left uncovered there is
# defensive error handling around filesystem races. The remaining headline gap
# is argument parsing and notification plumbing, which the smoke suite exercises
# through a subprocess where coverage cannot see it.
fail_under = 70
skip_covered = false
show_missing = false
