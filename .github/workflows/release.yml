name: Release

# Pushing a v* tag is the publish action. bin/release creates the tag but
# never pushes it, so nothing goes out without a deliberate push.
on:
  push:
    tags: ["v*"]
  # A dry run from the Actions tab or `gh workflow run release.yml`: every
  # step but the publish, so the pipeline can be checked without a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One build per runner pool. 0.3.0 waited hours because no Apple-silicon
  # runner could be had; whichever pool has room now carries the release.
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]

    steps:
      # First, so publish can tell a leg that ran and failed (which blocks
      # the release) from one that never got a machine (which does not).
      - name: Mark this leg as started
        run: echo "${{ matrix.os }}" > started.txt
      - uses: actions/upload-artifact@v4
        with:
          name: started-${{ matrix.os }}
          path: started.txt

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip build
          .venv/bin/pip install --quiet -e '.[dev]'

      # The tag is only trustworthy if the code at it passes. A tag that
      # publishes a broken build is worse than no release process at all.
      - name: Gate
        run: |
          .venv/bin/ruff check .
          .venv/bin/mypy folder_watch --ignore-missing-imports
          .venv/bin/python -m unittest discover -s tests
          ./bin/test-addons

      # A tag saying one thing and --version saying another is the failure
      # mode a release process exists to prevent.
      - name: Tag matches the packaged version
        run: |
          pkg=$(.venv/bin/python -c "from folder_watch._version import __version__; print(__version__)")
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "dry run on $GITHUB_REF_NAME: no tag to check; version $pkg"
            echo "version=$pkg" >> "$GITHUB_ENV"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match __version__ $pkg" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_ENV"

      - name: Build
        run: .venv/bin/python -m build

      - name: Notes from the changelog
        run: |
          .venv/bin/python - <<'PY' > dist/release-notes.md
          import os, re
          from pathlib import Path
          version = os.environ["version"]
          text = Path("CHANGELOG.md").read_text()
          # \Z, not just the next heading — the oldest section has none after
          # it, and that is exactly the one an initial release publishes.
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)",
              text, re.M | re.S,
          )
          print((match.group(1).strip() if match else "See CHANGELOG.md."))
          PY
          cat dist/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  publish:
    needs: build
    # Also when a leg failed: whether that blocks is decided below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: legs

      - name: Every leg that ran passed, and at least one did
        run: |
          shopt -s nullglob  # no leg started: an empty loop, not a literal "*"
          ls legs
          passed=""
          for started in legs/started-*; do
            os="${started#legs/started-}"
            if [ ! -f "legs/dist-$os/release-notes.md" ]; then
              echo "$os ran but did not pass; not releasing" >&2
              exit 1
            fi
            passed="$os"
          done
          if [ -z "$passed" ]; then
            echo "no leg got a runner; re-run this workflow" >&2
            exit 1
          fi
          echo "releasing the build from $passed"
          echo "dist=legs/dist-$passed" >> "$GITHUB_ENV"

      - name: Dry run - what would be published
        if: github.ref_type != 'tag'
        run: ls -l "$dist"; head -5 "$dist/release-notes.md"

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          body_path: ${{ env.dist }}/release-notes.md
          files: |
            ${{ env.dist }}/*.whl
            ${{ env.dist }}/*.tar.gz
          fail_on_unmatched_files: true
